[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitld-addon-scyllasband"
version = "26.11.1"
description = "Subtitld add-on: offline text-to-speech with Scylla's Band, 14 voices in 6 languages"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Subtitld", email = "jbopen@gmail.com" }]
requires-python = ">=3.10"

# No runtime dependencies. Synthesis is Scylla's Band's native runtime with
# LiteRT, built by tools/build_native.py and loaded with ctypes; the download
# uses the standard library.
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]
dev = ["pytest>=7.4"]

[project.scripts]
scyllasband-addon = "scyllasband_addon.__main__:main"

[tool.setuptools]
packages = ["scyllasband_addon"]

[tool.setuptools.package-data]
scyllasband_addon = ["pins.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
